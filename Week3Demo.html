<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Facts API Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      color: #333;
    }
    #fact-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      text-align: center;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #2b6cb0;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #2c5282;
    }
  </style>
</head>
<body>
  <h1>Random Cat Fact 🐱</h1>
  <div id="fact-box">Click the button to load a fact!</div>
  <button id="new-fact">Get New Fact</button>

  <script>
    const factBox = document.getElementById('fact-box');
    const button = document.getElementById('new-fact');

    async function getCatFact() {
      factBox.textContent = "Loading...";
      try {
        const response = await fetch('https://catfact.ninja/fact');
        const data = await response.json();
        factBox.textContent = data.fact;
      } catch (error) {
        factBox.textContent = "Something went wrong!";
        console.error(error);
      }
    }

    button.addEventListener('click', getCatFact);
  </script>
</body>
</html>
